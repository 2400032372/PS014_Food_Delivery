spring.application.name=order-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickbite_order
spring.datasource.username=postgres
spring.datasource.password=pranathiR@4444
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Payment Service
# Change this endpoint later if your Payment Service exposes a different payment URL.
payment.service.url=http://localhost:8084
payment.service.payment-path=/payments
